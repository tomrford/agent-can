name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
      - uses: ./.github/actions/setup-sfw
        with:
          token: ${{ github.token }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Go checks
        run: |
          go test -race ./...
          go vet ./...
          unformatted=$(gofmt -l cmd internal)
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Launcher checks
        run: |
          sfw uv sync --locked --dev
          sfw uv run ruff check .
          sfw uv run pytest
      - name: Build source distribution and native wheel
        run: sfw uv build --no-sources
      - name: Test installed wheel
        run: |
          sfw uv run --no-project --exclude-newer '7 days' --with ./dist/*.whl --with pytest python -m pytest tests/test_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-22.04'
        with:
          name: sdist
          path: dist/*.tar.gz
