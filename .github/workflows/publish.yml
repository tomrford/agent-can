name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate release version and ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          npx --yes sfw@2.0.6 uv run --no-project --python 3.12 python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          init = pathlib.Path("src/agent_can/__init__.py").read_text()
          package_version = re.search(r'^__version__ = "([^"]+)"$', init, re.MULTILINE).group(1)
          if os.environ["RELEASE_TAG"] != f"v{version}" or package_version != version:
              raise SystemExit("Release tag, package metadata and launcher version must agree")
          PY
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${RELEASE_TAG}^{commit}" origin/main
  build:
    needs: validate
    uses: ./.github/workflows/ci.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Publish tested distributions
        run: npx --yes sfw@2.0.6 uv publish
